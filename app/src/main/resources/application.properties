spring.application.name=endeavor-deep-sea
server.port=8080

# Boucle locale seulement : l'application est personnelle, aucune autre machine
# du reseau n'a a la joindre.
server.address=127.0.0.1

# Lecture stricte des requetes : un champ inconnu ou un nombre absent est une
# erreur, jamais une valeur par defaut silencieuse.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true

# Renseignee au build depuis la version Maven, pour ne pas dupliquer le numero.
application.version=@project.version@
